<div id="company-status" class="flex flex-wrap items-center gap-3">{{ badge }}{% for (key,label) in operations %}<button type="button" id="company-{{ key }}" data-event="request_lifecycle" data-operation="{{ key }}" class="{{ bilibi_ui::DEMOTED_ACTION_CLASS }} cursor-pointer">{{ label }}</button>{% endfor %}{% if final_status %}<span id="company-status-final" class="text-xs text-ink-muted">Archiving is final.</span>{% endif %}</div>
