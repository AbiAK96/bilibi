services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: bilibi
      POSTGRES_PASSWORD: bilibi
      POSTGRES_DB: bilibi
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - bilibi-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bilibi -d bilibi"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  bilibi-postgres:
